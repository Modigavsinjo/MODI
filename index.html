<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>მოდი გავსინჯო — გადახდა</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1f26; --muted:#6b7280; --accent:#1e2a44; --line:#d9dce3; --ok:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e25; --text:#f1f3f6; --muted:#9aa3b2; --accent:#3b82f6; --line:#2e333d; --ok:#22c55e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(160deg,#1e2a44 0%,#141b2d 100%); color:var(--text);
         font-family:system-ui,-apple-system,"Noto Sans Georgian",sans-serif; padding:16px; }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:16px; padding:24px;
          box-shadow:0 4px 24px rgba(0,0,0,.08); }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .banks { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
  .bank { padding:16px 8px; font-size:15px; font-weight:600; border:2px solid var(--line); border-radius:12px;
          background:transparent; color:var(--text); cursor:pointer; }
  .bank.active { border-color:var(--accent); background:var(--accent); color:#fff; }
  #details { display:none; }
  #details.show { display:block; }
  .label { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .value { font-size:15px; margin-bottom:16px; word-break:break-word; }
  .iban { font-family:ui-monospace,Menlo,monospace; font-size:17px; letter-spacing:.5px;
          padding:14px; border-radius:10px; background:var(--bg); margin-bottom:12px; user-select:all; word-break:break-all; }
  #copy { width:100%; padding:14px; font-size:16px; font-weight:600; border:0; border-radius:10px;
          background:var(--accent); color:#fff; cursor:pointer; }
  #copy.done { background:var(--ok); }
  .hint { color:var(--muted); font-size:13px; text-align:center; margin:0; }
</style>
</head>
<body>
<main class="card">
  <h1 style="text-align: center;">"მოდი გავსინჯო" </h1>
  <p></p>
  
  <div class="banks">
    <button class="bank" type="button" data-bank="bog">საქართველოს ბანკი</button>
    <button class="bank" type="button" data-bank="tbc">თიბისი ბანკი</button>
  </div>

  <div id="details">
    <div class="label">მიმღები</div>
    <div class="value">ქეთევან .ბ</div>

    <div class="label">ბანკი</div>
    <div class="value" id="bankName"></div>

    <div class="label">ანგარიშის ნომერი</div>
    <div class="iban" id="iban"></div>

    <button id="copy" type="button">ანგარიშის ნომრის კოპირება</button>
  </div>
  <p class="hint" id="hint">!!! გადარიცხვამდე აუცილებლად შეამოწმეთ მიმღების მონაცემები შენს საბანკო აპლიკაციაში !!! </p>
</main>

<script>
  // ↓ აქ ჩაწერე შენი რეალური მონაცემები
  const BANKS = {
    bog: { name: 'საქართველოს ბანკი', iban: 'GE43BG0000000613662097' },
    tbc: { name: 'თიბისი ბანკი',      iban: 'GE00TB0000000000000000' }
  };

  const btn = document.getElementById('copy');
  const ibanEl = document.getElementById('iban');
  const details = document.getElementById('details');
  const hint = document.getElementById('hint');

  document.querySelectorAll('.bank').forEach(b => {
    b.addEventListener('click', () => {
      const bank = BANKS[b.dataset.bank];
      document.querySelectorAll('.bank').forEach(x => x.classList.toggle('active', x === b));
      document.getElementById('bankName').textContent = bank.name;
      ibanEl.textContent = bank.iban;
      details.classList.add('show');
      hint.style.display = 'none';
      btn.textContent = 'ანგარიშის ნომრის კოპირება';
      btn.classList.remove('done');
    });
  });

  btn.addEventListener('click', async () => {
    const text = ibanEl.textContent.trim();
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const r = document.createRange(); r.selectNodeContents(ibanEl);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      document.execCommand('copy');
    }
    btn.textContent = '✓ დაკოპირდა';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'ანარიშის ნომრის კოპირება'; btn.classList.remove('done'); }, 2000);
  });
</script>
</body>
</html>
